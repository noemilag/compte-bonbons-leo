<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d1259"/>
      <stop offset=".6" stop-color="#1a0a30"/>
      <stop offset="1" stop-color="#0a0614"/>
    </linearGradient>
    <radialGradient id="moon" cx=".38" cy=".35" r=".7">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset=".6" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e3a234"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#e2541b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="96" cy="92" r="4"/><circle cx="170" cy="58" r="3"/><circle cx="62" cy="186" r="3"/><circle cx="244" cy="110" r="2.5"/>
  </g>
  <!-- moon -->
  <circle cx="392" cy="118" r="74" fill="#ffd60a" opacity=".18"/>
  <circle cx="392" cy="118" r="54" fill="url(#moon)"/>
  <circle cx="374" cy="128" r="10" fill="#c98a2a" opacity=".35"/>
  <circle cx="404" cy="100" r="6" fill="#c98a2a" opacity=".35"/>
  <!-- glow under the bucket -->
