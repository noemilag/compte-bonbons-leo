  <!-- jack-o'-lantern bucket -->
  <path d="M256 234 C256 222 262 214 272 210" stroke="#3fbf2a" stroke-width="14" stroke-linecap="round" fill="none"/>
  <ellipse cx="176" cy="352" rx="96" ry="118" fill="#e2541b"/>
  <ellipse cx="336" cy="352" rx="96" ry="118" fill="#e2541b"/>
  <ellipse cx="256" cy="352" rx="112" ry="126" fill="url(#pk)"/>
  <path d="M256 228 C232 300 232 410 256 478" stroke="#c4440f" stroke-width="6" fill="none" opacity=".6"/>
  <ellipse cx="256" cy="246" rx="132" ry="18" fill="#7a2600"/>
  <!-- glowing face -->
  <g fill="#ffd60a">
    <path d="M178 330 L210 286 L240 330 Z"/>
    <path d="M272 330 L302 286 L334 330 Z"/>
    <path d="M244 352 L256 334 L268 352 Z"/>
    <path d="M170 380 Q256 452 342 380 L322 390 L306 374 L290 396 L270 380 L256 402 L242 380 L222 396 L206 374 L190 390 Z"/>
