  <g>
    <line x1="182" y1="250" x2="150" y2="180" stroke="#d9c4ff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="146" cy="168" r="34" fill="#b46cff"/>
    <path d="M146 168 m-16 0 a16 16 0 1 0 16 -16" fill="none" stroke="#ecdcff" stroke-width="8" stroke-linecap="round"/>
    <path d="M262 214 L232 192 L232 236 Z" fill="#b8ff9a"/>
    <path d="M318 214 L348 192 L348 236 Z" fill="#b8ff9a"/>
    <circle cx="290" cy="214" r="30" fill="#7cff4f"/>
    <path d="M276 200 Q290 214 284 236" stroke="#d9ffc9" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="214" cy="228" r="24" fill="#ff4fa3"/>
    <circle cx="206" cy="220" r="7" fill="#ffc2e0"/>
    <circle cx="362" cy="238" r="22" fill="#ffd60a"/>
